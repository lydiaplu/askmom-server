spring.application.name=askmom-user-service
server.port=9180

# Active runtime profile
# 当前激活的运行环境
spring.profiles.active=dev

spring.datasource.url=jdbc:mysql://localhost:3306/user_service_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Multipart upload size limits
# 文件上传大小限制
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=10MB

# JPA and Hibernate base settings
# JPA 与 Hibernate 基础配置
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway migration settings
# Flyway 数据库迁移配置
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Print and format SQL in console (for development debugging)
# 控制台打印并格式化 SQL（开发调试用）
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# Hibernate SQL and bind parameter log levels
# Hibernate SQL 与参数日志级别
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Application and framework log levels
# 应用与框架日志级别
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.hopeonllc.askmom_user_service=INFO

# Optional level pattern for local readable logs
# 本地可读日志的可选级别展示格式
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{requestId:-}]

auth.token.jwtSecret=${AUTH_TOKEN_JWT_SECRET:bXlEZXZlbG9wbWVudEp3dFNlY3JldEtleU15RGV2ZWxvcG1lbnRKd3RTZWNyZXRLZXk=}
auth.token.expirationInMils=${AUTH_TOKEN_EXPIRATION_IN_MILS:86400000}
